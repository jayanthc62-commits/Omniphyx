name: Build FreeTube Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Omniphyx (Your New Code)
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Your Latest Web App
        run: |
          npm install
          npm run build

      - name: Clone Android Wrapper
        run: |
          rm -rf FreeTubeAndroid
          git clone --depth 1 --branch development https://github.com/MarmadileManteater/FreeTubeAndroid.git FreeTubeAndroid

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack install --global pnpm@12.3.4

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Wrapper dependencies
        working-directory: FreeTubeAndroid
        run: pnpm install --frozen-lockfile

      - name: Inject Your Modernized App into Android Assets
        working-directory: FreeTubeAndroid
        run: |
          pnpm run pack:botGuardScript:android || true
          mkdir -p android/app/src/main/assets
          cp -rf ../dist/* android/app/src/main/assets/
          echo "=== Contents of Android Assets ==="
          ls -la android/app/src/main/assets/

      - name: Build debug APK
        working-directory: FreeTubeAndroid/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeTubeAndroid-debug
          path: FreeTubeAndroid/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
