name: Build FreeTube Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Omniphyx (Your Latest App)
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Your Latest Web App (Vintora & Studio)
        run: |
          npm install
          npm run build

      - name: Clone Android APK Wrapper
        run: |
          rm -rf FreeTubeAndroid
          git clone --depth 1 --branch development https://github.com/MarmadileManteater/FreeTubeAndroid.git FreeTubeAndroid

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack install --global pnpm@12.3.4

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Wrapper dependencies
        working-directory: FreeTubeAndroid
        run: pnpm install --frozen-lockfile

      - name: Prepare Android assets & inject your new app
        working-directory: FreeTubeAndroid
        run: |
          pnpm run pack:android || true
          pnpm run botGuardScript:android || true
          # Overwrite Android assets with your updated build
          ASSET_DIR=$(find android -type d -name "assets" | head -n 1)
          if [ -n "$ASSET_DIR" ]; then
            echo "Injecting into $ASSET_DIR"
            cp -r ../dist/* "$ASSET_DIR/" || true
          fi

      - name: Build debug APK
        working-directory: FreeTubeAndroid/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeTubeAndroid-latest-vintora
          path: FreeTubeAndroid/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
